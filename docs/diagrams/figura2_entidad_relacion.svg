<svg viewBox="0 0 850 440" width="1700" height="880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Entidad: PERSONA -->
  <g transform="translate(30, 40)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="220" height="175" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#2563eb"/>
    <text x="110" y="21" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">persona</text>
    <text x="15" y="55" font-family="Courier" font-size="10" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="55" font-weight="bold" fill="#0f172a" font-size="10.5">cc</text>
    <text x="140" y="55" fill="#64748b" font-size="9.5">INT(15)</text>

    <line x1="10" y1="65" x2="210" y2="65" stroke="#e2e8f0" stroke-width="1"/>
    <text x="45" y="85" fill="#0f172a" font-size="10.5">nombre</text>
    <text x="140" y="85" fill="#64748b" font-size="9.5">VARCHAR(45)</text>
    <text x="45" y="108" fill="#0f172a" font-size="10.5">apellido</text>
    <text x="140" y="108" fill="#64748b" font-size="9.5">VARCHAR(45)</text>
    <text x="45" y="131" fill="#0f172a" font-size="10.5">genero</text>
    <text x="140" y="131" fill="#64748b" font-size="9">ENUM('M','F')</text>
    <text x="45" y="154" fill="#0f172a" font-size="10.5">edad</text>
    <text x="140" y="154" fill="#64748b" font-size="9.5">INT(3)</text>
  </g>

  <!-- Entidad: TELEFONO -->
  <g transform="translate(30, 270)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="220" height="135" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#2563eb"/>
    <text x="110" y="21" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">telefono</text>
    <text x="15" y="55" font-family="Courier" font-size="10" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="55" font-weight="bold" fill="#0f172a" font-size="10.5">num</text>
    <text x="140" y="55" fill="#64748b" font-size="9.5">VARCHAR(15)</text>

    <line x1="10" y1="65" x2="210" y2="65" stroke="#e2e8f0" stroke-width="1"/>
    <text x="45" y="87" fill="#0f172a" font-size="10.5">oper</text>
    <text x="140" y="87" fill="#64748b" font-size="9.5">VARCHAR(45)</text>
    <text x="15" y="112" font-family="Courier" font-size="10" font-weight="bold" fill="#2563eb">FK</text>
    <text x="45" y="112" fill="#0f172a" font-size="10.5">duenio</text>
    <text x="140" y="112" fill="#64748b" font-size="9.5">INT(15)</text>
  </g>

  <!-- Entidad: PROFESION -->
  <g transform="translate(580, 40)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="230" height="145" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="32" rx="6" fill="#059669"/>
    <text x="115" y="21" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">profesion</text>
    <text x="15" y="55" font-family="Courier" font-size="10" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="55" font-weight="bold" fill="#0f172a" font-size="10.5">id</text>
    <text x="145" y="55" fill="#64748b" font-size="9.5">INT(6)</text>

    <line x1="10" y1="65" x2="220" y2="65" stroke="#e2e8f0" stroke-width="1"/>
    <text x="45" y="88" fill="#0f172a" font-size="10.5">nom</text>
    <text x="145" y="88" fill="#64748b" font-size="9.5">VARCHAR(90)</text>
    <text x="45" y="118" fill="#0f172a" font-size="10.5">des</text>
    <text x="145" y="118" fill="#64748b" font-size="9.5">TEXT</text>
  </g>

  <!-- Entidad: ESTUDIOS (Relación N:M reificada) -->
  <g transform="translate(305, 140)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="235" height="175" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="235" height="32" rx="6" fill="#d97706"/>
    <text x="117" y="21" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">estudios</text>
    <text x="12" y="55" font-family="Courier" font-size="9.5" font-weight="bold" fill="#b45309">PK,FK</text>
    <text x="55" y="55" font-weight="bold" fill="#0f172a" font-size="10.5">id_prof</text>
    <text x="150" y="55" fill="#64748b" font-size="9.5">INT(6)</text>

    <text x="12" y="78" font-family="Courier" font-size="9.5" font-weight="bold" fill="#b45309">PK,FK</text>
    <text x="55" y="78" font-weight="bold" fill="#0f172a" font-size="10.5">cc_per</text>
    <text x="150" y="78" fill="#64748b" font-size="9.5">INT(15)</text>

    <line x1="10" y1="88" x2="225" y2="88" stroke="#e2e8f0" stroke-width="1"/>
    <text x="55" y="112" fill="#0f172a" font-size="10.5">fecha</text>
    <text x="150" y="112" fill="#64748b" font-size="9.5">DATE</text>
    <text x="55" y="142" fill="#0f172a" font-size="10.5">univer</text>
    <text x="150" y="142" fill="#64748b" font-size="9.5">VARCHAR(50)</text>
  </g>

  <!-- ================= RELACIONES (CROW'S FOOT / CARDINALIDADES) ================= -->
  <!-- persona (1) -> telefono (N) -->
  <line x1="140" y1="215" x2="140" y2="270" stroke="#1e293b" stroke-width="2"/>
  <circle cx="140" cy="225" r="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <line x1="134" y1="233" x2="146" y2="233" stroke="#1e293b" stroke-width="2"/>
  <!-- Pata de gallo en telefono -->
  <line x1="130" y1="260" x2="140" y2="270" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="260" x2="140" y2="270" stroke="#1e293b" stroke-width="2"/>
  <text x="150" y="245" fill="#475569" font-size="9" font-weight="600">1 : 0..N</text>

  <!-- persona (1) -> estudios (N) -->
  <path d="M 250 120 L 305 180" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="293" y1="172" x2="305" y2="180" stroke="#1e293b" stroke-width="2"/>
  <line x1="298" y1="187" x2="305" y2="180" stroke="#1e293b" stroke-width="2"/>
  <text x="250" y="160" fill="#475569" font-size="9" font-weight="600">1 : 0..N</text>

  <!-- profesion (1) -> estudios (N) -->
  <path d="M 580 120 L 540 180" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="552" y1="172" x2="540" y2="180" stroke="#1e293b" stroke-width="2"/>
  <line x1="548" y1="187" x2="540" y2="180" stroke="#1e293b" stroke-width="2"/>
  <text x="560" y="160" fill="#475569" font-size="9" font-weight="600">1 : 0..N</text>
</svg>