<svg viewBox="0 0 900 460" width="1800" height="920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="seqReturn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Encabezados de Líneas de Vida -->
  <!-- 1. Cliente -->
  <rect x="20" y="15" width="100" height="35" rx="5" fill="#1e293b"/>
  <text x="70" y="37" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="10">Cliente / Swagger</text>
  <line x1="70" y1="50" x2="70" y2="440" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 2. Controller -->
  <rect x="145" y="15" width="115" height="35" rx="5" fill="#2563eb"/>
  <text x="202" y="37" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="10">PersonaControllerV1</text>
  <line x1="202" y1="50" x2="202" y2="440" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 3. Input Adapter -->
  <rect x="285" y="15" width="125" height="35" rx="5" fill="#3b82f6"/>
  <text x="347" y="37" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="9.5">PersonaInputAdapterRest</text>
  <line x1="347" y1="50" x2="347" y2="440" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 4. Use Case -->
  <rect x="435" y="15" width="110" height="35" rx="5" fill="#f59e0b"/>
  <text x="490" y="37" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="10">PersonUseCase</text>
  <line x1="490" y1="50" x2="490" y2="440" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 5. Output Adapter -->
  <rect x="570" y="15" width="135" height="35" rx="5" fill="#059669"/>
  <text x="637" y="37" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="9.5">PersonOutputAdapterMaria</text>
  <line x1="637" y1="50" x2="637" y2="440" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- 6. BD MariaDB -->
  <rect x="735" y="15" width="120" height="35" rx="5" fill="#0284c7"/>
  <text x="795" y="37" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="10">MariaDB 10.6 (SQL)</text>
  <line x1="795" y1="50" x2="795" y2="440" stroke="#94a3b8" stroke-dasharray="4"/>

  <!-- Mensajes -->
  <!-- 1 -->
  <line x1="70" y1="80" x2="202" y2="80" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="136" y="74" text-anchor="middle" fill="#0f172a" font-size="8.5">1: GET /api/v1/persona/MARIA/123456789</text>

  <!-- 2 -->
  <line x1="202" y1="110" x2="347" y2="110" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="274" y="104" text-anchor="middle" fill="#0f172a" font-size="8.5">2: obtenerPersona("MARIA", 123456789)</text>

  <!-- Nota de resolución dinámica -->
  <rect x="310" y="125" width="165" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="392" y="139" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400e">Resolución Dinámica:</text>
  <text x="392" y="151" text-anchor="middle" font-size="7.5" fill="#78350f">Inyecta adapter según "MARIA"</text>

  <!-- 3 -->
  <line x1="347" y1="175" x2="490" y2="175" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="418" y="169" text-anchor="middle" fill="#0f172a" font-size="8.5">3: setPersistence(PersonOutputAdapterMaria)</text>

  <!-- 4 -->
  <line x1="347" y1="205" x2="490" y2="205" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="418" y="199" text-anchor="middle" fill="#0f172a" font-size="8.5">4: findOne(123456789)</text>

  <!-- 5 -->
  <line x1="490" y1="235" x2="637" y2="235" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="563" y="229" text-anchor="middle" fill="#0f172a" font-size="8.5">5: findOne(123456789) [via OutputPort]</text>

  <!-- 6 -->
  <line x1="637" y1="265" x2="795" y2="265" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="716" y="259" text-anchor="middle" fill="#0f172a" font-size="8.5">6: SELECT * FROM persona WHERE cc = 123456789</text>

  <!-- 7 Retorno BD -->
  <line x1="795" y1="295" x2="637" y2="295" stroke="#059669" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#seqReturn)"/>
  <text x="716" y="289" text-anchor="middle" fill="#065f46" font-size="8">7: ResultSet / PersonaEntity</text>

  <!-- Mapeo shallow -->
  <rect x="580" y="308" width="135" height="24" rx="3" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="647" y="323" text-anchor="middle" font-size="7.5" fill="#065f46">Mapeo Shallow (sin ciclos)</text>

  <!-- 8 Retorno Adapter -->
  <line x1="637" y1="345" x2="490" y2="345" stroke="#059669" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#seqReturn)"/>
  <text x="563" y="339" text-anchor="middle" fill="#065f46" font-size="8">8: Person (Dominio Puro)</text>

  <!-- 9 Retorno UseCase -->
  <line x1="490" y1="375" x2="347" y2="375" stroke="#059669" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#seqReturn)"/>
  <text x="418" y="369" text-anchor="middle" fill="#065f46" font-size="8">9: Person</text>

  <!-- 10 Retorno Adapter a Controller -->
  <line x1="347" y1="405" x2="202" y2="405" stroke="#059669" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#seqReturn)"/>
  <text x="274" y="399" text-anchor="middle" fill="#065f46" font-size="8">10: PersonaResponse (DTO)</text>

  <!-- 11 Retorno HTTP -->
  <line x1="202" y1="425" x2="70" y2="425" stroke="#059669" stroke-width="2" marker-end="url(#seqReturn)"/>
  <text x="136" y="419" text-anchor="middle" font-weight="bold" fill="#047857" font-size="8.5">11: 200 OK [JSON]</text>
</svg>